name: CI CPU testing

on:
  push:
    branches: [ yuu-eguci-dev ]
  pull_request:
    branches: [ yuu-eguci-dev ]

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pytest
      - name: Test
        run: python -m pytest tests -v
      - name: Detect sample images with v5.0 yolov5s.pt
        run: |
          python detect.py --source data/images --weights yolov5s.pt --conf-thres 0.50 | tee detect.log
          grep -E "bus.jpg: .*bus" detect.log
          test -f runs/detect/exp/bus.jpg && test -f runs/detect/exp/zidane.jpg
